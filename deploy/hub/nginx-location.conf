# Include inside an existing HTTPS server block, with a trusted certificate.
# Hub must be on this same machine and listen only on 127.0.0.1:4387.
# The service occupies the domain root; a /share-token/ path prefix is unsupported.
# Define this map once in the nginx http block, outside any server/location:
# map $http_upgrade $connection_upgrade { default upgrade; '' close; }
location / {
    proxy_pass http://127.0.0.1:4387;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    gzip off;
    proxy_read_timeout 960s;
    proxy_send_timeout 960s;
    client_max_body_size 8m;
}
